<div class="page" data-testid="quote-wizard">
  <div class="page-head">
    <div>
      <h1>New quote</h1>
      <p>Upload a drawing, pick a material, add bends, and price the job.</p>
    </div>
    <a class="btn btn--ghost" routerLink="/quotes" data-testid="wizard-cancel">Cancel</a>
  </div>

  <ol class="stepper" data-testid="wizard-stepper">
    @for (step of steps; track step.path; let i = $index) {
      <li class="stepper__item" [class.is-active]="isActive(step.path)">
        <a [routerLink]="['/quote/new', step.path]" [attr.data-testid]="'step-' + step.path">
          <span class="stepper__num">{{ i + 1 }}</span>
          <span class="stepper__label">{{ step.label }}</span>
        </a>
      </li>
    }
  </ol>

  <router-outlet />
</div>
